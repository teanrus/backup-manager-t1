# Backup Manager - резервное копирование
# Файл конфигурации по умолчанию
# Измените параметры после установки через: sudo /usr/share/redos-backup-manager/scripts/setup.sh

# ==========================================
# SMB подключение
# ==========================================
SMB_SERVER="192.168.1.100"
SMB_SHARE="backups"
SMB_USERNAME="backup_user"
SMB_PASSWORD=""
SMB_DOMAIN="WORKGROUP"
MOUNT_POINT="/mnt/backup"

# ==========================================
# Параметры rsync
# ==========================================
COMPRESSION="true"
DELETE_EXTRA="true"
BANDWIDTH_LIMIT=0
MAX_RETRIES=3
RETRY_DELAY=60
VERBOSE="false"

# Исключения (шаблоны файлов/каталогов через пробел)
EXCLUDE_PATTERNS="*.tmp *.cache .thumbnails *.swp"

# ==========================================
# Уведомления
# ==========================================
NOTIFY_EMAIL=""

# ==========================================
# Каталоги для резервного копирования
# ==========================================
USER_HOME="/home/user"
BACKUP_DIRS="Документы Изображения Рабочий\ стол Загрузки .config"
